version: '3.8'

services:
  # Week 1 Services
  marketservice:
    build:
      context: ./src/marketservice
      dockerfile: Dockerfile
    ports:
      - "3550:3550"
    environment:
      - PORT=3550
      - ENABLE_KAFKA=${ENABLE_KAFKA:-1}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_API_KEY=${KAFKA_API_KEY}
      - KAFKA_API_SECRET=${KAFKA_API_SECRET}
    volumes:
      - ./src/marketservice/data:/root/data
    networks:
      - vibe-markets-net
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3550 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bettingservice:
    build:
      context: ./src/bettingservice
      dockerfile: Dockerfile
    ports:
      - "3551:3551"
    environment:
      - PORT=3551
      - ENABLE_KAFKA=${ENABLE_KAFKA:-1}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_API_KEY=${KAFKA_API_KEY}
      - KAFKA_API_SECRET=${KAFKA_API_SECRET}
    networks:
      - vibe-markets-net
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3551 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Week 3 Services
  socialfeedservice:
    build:
      context: ./src/socialfeedservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENABLE_KAFKA=${ENABLE_KAFKA:-1}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_API_KEY=${KAFKA_API_KEY}
      - KAFKA_API_SECRET=${KAFKA_API_SECRET}
    networks:
      - vibe-markets-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - marketservice
      - bettingservice

  frauddetection:
    build:
      context: ./src/frauddetection
      dockerfile: Dockerfile
    environment:
      - ENABLE_KAFKA=${ENABLE_KAFKA:-1}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_API_KEY=${KAFKA_API_KEY}
      - KAFKA_API_SECRET=${KAFKA_API_SECRET}
    networks:
      - vibe-markets-net
    depends_on:
      - marketservice
      - bettingservice

  # Week 2 Services (NEW)
  aiservice:
    build:
      context: ./src/aiservice
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    networks:
      - vibe-markets-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  apigateway:
    build:
      context: ./src/apigateway
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - MARKET_SERVICE_URL=http://marketservice:3550
      - BETTING_SERVICE_URL=http://bettingservice:3551
      - SOCIAL_FEED_SERVICE_URL=http://socialfeedservice:8080
      - AI_SERVICE_URL=http://aiservice:8081
    networks:
      - vibe-markets-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - marketservice
      - bettingservice
      - socialfeedservice
      - aiservice

networks:
  vibe-markets-net:
    driver: bridge
