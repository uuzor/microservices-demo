version: '3.8'

services:
  # Wallet Service - User balance management
  walletservice:
    build:
      context: ./src/walletservice
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - vibecast-network

  # Payment Service - Crypto deposits/withdrawals
  paymentservice:
    build:
      context: ./src/paymentservice
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - WALLET_SERVICE_URL=http://walletservice:8085
      - BLOCKCHAIN_NETWORK=polygon-mainnet
      - BLOCKCHAIN_RPC=https://polygon-rpc.com
    depends_on:
      - walletservice
    networks:
      - vibecast-network

  # Fee Service - Fee calculation and revenue tracking
  feeservice:
    build:
      context: ./src/feeservice
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
    networks:
      - vibecast-network

  # Market Service (from Week 1)
  marketservice:
    build:
      context: ./src/marketservice
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - vibecast-network

  # Betting Service (from Week 1)
  bettingservice:
    build:
      context: ./src/bettingservice
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - WALLET_SERVICE_URL=http://walletservice:8085
      - FEE_SERVICE_URL=http://feeservice:8087
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - walletservice
      - feeservice
      - kafka
    networks:
      - vibecast-network

  # Social Feed Service (from Week 3)
  socialfeedservice:
    build:
      context: ./src/socialfeedservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - vibecast-network

  # AI Service (from Week 2)
  aiservice:
    build:
      context: ./src/aiservice
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - vibecast-network

  # API Gateway (from Week 2)
  apigateway:
    build:
      context: ./src/apigateway
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - MARKET_SERVICE_URL=http://marketservice:8081
      - BETTING_SERVICE_URL=http://bettingservice:8082
      - AI_SERVICE_URL=http://aiservice:8083
      - SOCIAL_FEED_URL=http://socialfeedservice:8080
      - WALLET_SERVICE_URL=http://walletservice:8085
      - PAYMENT_SERVICE_URL=http://paymentservice:8086
      - FEE_SERVICE_URL=http://feeservice:8087
    depends_on:
      - marketservice
      - bettingservice
      - aiservice
      - socialfeedservice
      - walletservice
      - paymentservice
      - feeservice
    networks:
      - vibecast-network

  # Kafka (event streaming)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vibecast-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - vibecast-network

  # Frontend (from Week 5)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    depends_on:
      - apigateway
    networks:
      - vibecast-network

networks:
  vibecast-network:
    driver: bridge
